    <g id="front-wheel-arch">
      <path d="M1080 591C1082 515 1135 458 1203 458C1270 458 1324 515 1326 591H1388V624H1010V591H1080Z" fill="#0B1119" opacity=".96"/>
      <path d="M1101 590C1103 527 1146 478 1203 478C1260 478 1304 527 1306 590H1326C1324 513 1271 450 1203 450C1135 450 1081 513 1080 590H1101Z" fill="#28313F"/>
    </g>

    <!-- GROUP: rear wheel -->
    <g id="rear-wheel" filter="url(#softShadow)">
      <circle cx="451" cy="604" r="118" fill="#0A0D12"/>
      <circle cx="451" cy="604" r="103" fill="url(#tire)" stroke="#3B4655" stroke-width="7"/>
      <circle cx="451" cy="604" r="76" fill="#111722" stroke="#596574" stroke-width="4"/>
      <circle cx="451" cy="604" r="66" fill="url(#rim)"/>
      <circle cx="451" cy="604" r="28" fill="#8C96A2"/>
      <circle cx="451" cy="604" r="15" fill="#15844B" stroke="#0D5E36" stroke-width="4"/>
      <g fill="#3E4853">
        <path d="M442 545L459 545L473 587L453 596Z"/>
        <path d="M503 570L514 582L478 608L468 589Z"/>
        <path d="M501 635L491 648L463 616L481 606Z"/>
        <path d="M460 663L443 663L432 621L451 612Z"/>
        <path d="M399 638L388 626L424 602L434 620Z"/>
        <path d="M398 574L408 561L438 592L420 602Z"/>
      </g>
      <circle cx="451" cy="604" r="48" fill="none" stroke="#F2F6FA" stroke-width="3" opacity=".45"/>
      <circle cx="451" cy="604" r="90" fill="none" stroke="#687383" stroke-width="4" opacity=".28"/>
    </g>

    <!-- GROUP: front wheel -->
    <g id="front-wheel" filter="url(#softShadow)">
      <circle cx="1203" cy="604" r="118" fill="#0A0D12"/>
      <circle cx="1203" cy="604" r="103" fill="url(#tire)" stroke="#3B4655" stroke-width="7"/>
      <circle cx="1203" cy="604" r="76" fill="#111722" stroke="#596574" stroke-width="4"/>
      <circle cx="1203" cy="604" r="66" fill="url(#rim)"/>
      <circle cx="1203" cy="604" r="28" fill="#8C96A2"/>
      <circle cx="1203" cy="604" r="15" fill="#15844B" stroke="#0D5E36" stroke-width="4"/>
      <g fill="#3E4853">
        <path d="M1194 545L1211 545L1225 587L1205 596Z"/>
        <path d="M1256 570L1266 582L1230 608L1220 589Z"/>
        <path d="M1253 635L1243 648L1215 616L1233 606Z"/>
        <path d="M1212 663L1195 663L1184 621L1203 612Z"/>
        <path d="M1151 638L1140 626L1176 602L1186 620Z"/>
        <path d="M1150 574L1160 561L1190 592L1172 602Z"/>
      </g>
      <circle cx="1203" cy="604" r="48" fill="none" stroke="#F2F6FA" stroke-width="3" opacity=".45"/>
      <circle cx="1203" cy="604" r="90" fill="none" stroke="#687383" stroke-width="4" opacity=".28"/>
    </g>

    <!-- subtle wheel highlight -->
    <path d="M367 557C384 523 414 501 449 497" stroke="#7B8794" stroke-width="5" stroke-linecap="round" opacity=".24"/>
    <path d="M1119 557C1136 523 1166 501 1201 497" stroke="#7B8794" stroke-width="5" stroke-linecap="round" opacity=".24"/>

    <!-- front lower step -->
    <path d="M939 582H1031V624H926C915 624 908 616 908 605V598C908 589 921 582 939 582Z" fill="#1A2530"/>
    <path d="M931 592H1002" stroke="#475361" stroke-width="5" stroke-linecap="round"/>

    <!-- rear lower step -->
    <path d="M183 578H299V624H165C154 624 147 616 147 606V598C147 587 160 578 183 578Z" fill="#1A2530"/>
    <path d="M175 590H269" stroke="#475361" stroke-width="5" stroke-linecap="round"/>

    <!-- optional speed lines group for future animation -->
    <g id="speed-lines" opacity="0">
      <rect x="35" y="300" width="145" height="15" rx="7.5" fill="#2BC66C"/>
      <rect x="72" y="336" width="205" height="15" rx="7.5" fill="#48D77D"/>
      <rect x="22" y="372" width="160" height="15" rx="7.5" fill="#2BC66C"/>
    </g>
  </g>
</svg>
